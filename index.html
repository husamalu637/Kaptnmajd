
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صدى الطفولة | كابتن ماجد HD</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --bg: #0b0f19;
            --card: #161e2e;
            --text: #ffffff;
            --accent: #ff9800;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 40px 0;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        header h1 { margin: 0; font-size: 2.2rem; font-weight: 900; }
        header p { margin: 10px 0 0; opacity: 0.9; }

        .main-container {
            max-width: 900px;
            width: 95%;
            margin: 30px auto;
        }

        .video-wrapper {
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid var(--primary);
            box-shadow: 0 10px 30px rgba(0, 210, 255, 0.2);
            margin-bottom: 30px;
            display: none;
        }

        .responsive-iframe {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }

        .responsive-iframe iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 0;
        }

        .video-footer {
            padding: 15px;
            background: var(--card);
            text-align: center;
            font-weight: bold;
            color: var(--primary);
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .section-header {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--text);
        }

        .episodes-container {
            background: var(--card);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 12px;
        }

        .ep-btn {
            background: #252f44;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px 0;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .ep-btn:hover {
            background: var(--primary);
            color: #000;
            transform: translateY(-3px);
        }

        .ep-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(255, 152, 0, 0.4);
        }

        footer {
            margin: 40px 0;
            opacity: 0.5;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<header>
    <h1>🎬 صدى الطفولة</h1>
    <p>مسلسل كابتن ماجد بجودة HD</p>
</header>

<div class="main-container">
    
    <div id="videoContainer" class="video-wrapper">
        <div class="responsive-iframe">
            <iframe id="mainIframe" src="" frameborder="0" allowfullscreen="" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>
        </div>
        <div id="epTitle" class="video-footer"></div>
    </div>

    <div class="section-header">قائمة الحلقات</div>
    
    <div class="episodes-container">
        <div class="episodes-grid" id="buttonsGrid"></div>
    </div>

</div>

<footer>
    <p>جميع الحقوق محفوظة - صدى الطفولة &copy; 2026</p>
</footer>

<script>
    // معرفات الحلقات المستخرجة من الروابط التي أرسلتها
    const ids = [
        "4005", "4006", "4007", "4008", "4009", "4010", "4011", "4012", "4013", "4014",
        "4015", "4016", "4017", "4018", "4019", "4020", "4021", "4022", "4023", "4024",
        "4025", "4026", "4027", "4028", "4029", "4030", "4031", "4032", "4033", "4034",
        "4035", "4036", "4037", "4038", "4039", "4040", "4041", "4042", "4043", "4044",
        "4045", "4046", "4047", "4048", "4049", "4050", "4051", "4052", "4053", "4054",
        "4055", "4056", "4057", "4058", "4059"
    ];

    const grid = document.getElementById('buttonsGrid');
    const container = document.getElementById('videoContainer');
    const iframe = document.getElementById('mainIframe');
    const titleDisp = document.getElementById('epTitle');

    ids.forEach((id, index) => {
        const btn = document.createElement('button');
        btn.className = 'ep-btn';
        btn.innerText = index + 1;
        btn.onclick = function() {
            // فتح الإعلان
            window.open('https://www.profitablecpmratenetwork.com/e41dj2h87?key=bef514b5ca3fa945e7a3b60e4a9ef21a', '_blank');
            
            // تحديث الفيديو (ملاحظة: تأكد من أن الموقع cartoony يسمح بالـ Embed)
            container.style.display = 'block';
            iframe.src = "https://cartoony.net/embed/" + id;
            titleDisp.innerText = "أنت تشاهد الآن: الحلقة " + (index + 1);

            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            container.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
        grid.appendChild(btn);
    });
</script>

</body>
</html>
